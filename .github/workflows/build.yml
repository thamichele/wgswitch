name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_RELEASE_KEY: ${{ secrets.WGSWITCH_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      # stessa toolchain senza Gradle usata in locale (vedi build.sh)
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q aapt dalvik-exchange zipalign apksigner

      - name: Download Android API jars
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO https://repo1.maven.org/maven2/org/robolectric/android-all/15-robolectric-13954326/android-all-15-robolectric-13954326.jar
          curl -sSfLO https://repo1.maven.org/maven2/org/robolectric/android-all/13-robolectric-9030017/android-all-13-robolectric-9030017.jar
          unzip -q android-all-13-robolectric-9030017.jar resources.arsc AndroidManifest.xml
          zip -q android-res-33.zip resources.arsc AndroidManifest.xml

      # firmato con una chiave usa e getta: serve solo a verificare che il codice compili
      - name: Build test APK
        run: |
          export ANDROID_CLASSES="$RUNNER_TEMP/android-all-15-robolectric-13954326.jar"
          export ANDROID_RES="$RUNNER_TEMP/android-res-33.zip"
          export KEYSTORE="$RUNNER_TEMP/test.jks" KS_PASS="$(openssl rand -hex 16)"
          ./build.sh
          aapt dump badging build/*.apk | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: wgswitch-test-apk
          path: build/wgswitch-*.apk
          if-no-files-found: error

      # APK firmato con la chiave vera (la stessa di sempre, così gli aggiornamenti funzionano).
      # Solo su main o avvio manuale, e solo se i secret WGSWITCH_KEYSTORE_BASE64 e WGSWITCH_KEYSTORE_PASSWORD esistono.
      - name: Build signed APK
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEY == 'true'
        env:
          KS_B64: ${{ secrets.WGSWITCH_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.WGSWITCH_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_CLASSES="$RUNNER_TEMP/android-all-15-robolectric-13954326.jar"
          export ANDROID_RES="$RUNNER_TEMP/android-res-33.zip"
          export KEYSTORE="$RUNNER_TEMP/wgswitch.jks"
          echo "$KS_B64" | base64 -d > "$KEYSTORE"
          ./build.sh
          # rifiuta un APK firmato con una chiave diversa: romperebbe gli aggiornamenti
          apksigner verify --print-certs build/wgswitch-*.apk | grep -qi 'SHA-256 digest: 23234767bec703550d705d3cd819d578832a2a1c7f9cebef15784125dac5caa0' \
            || { echo "Certificato diverso da quello di WG Switch" >&2; exit 1; }
          rm -f "$KEYSTORE"
          (cd build && sha256sum wgswitch-*.apk > "$(ls wgswitch-*.apk).sha256")

      - name: Upload signed APK
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wgswitch-signed-apk
          path: build/wgswitch-*.apk*
          if-no-files-found: error
